<!DOCTYPE html>
<html>
<head>
    <title>Монитор температуры</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: #4CAF50; color: white; padding: 20px; border-radius: 5px; }
        .sensors { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .sensor-card { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sensor-value { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .sensor-label { color: #666; font-size: 0.9em; }
        .temp { color: #e74c3c; }
        .humidity { color: #3498db; }
        .pressure { color: #9b59b6; }
        .chart-container { background: white; padding: 20px; border-radius: 5px; margin-top: 20px; }
        .last-update { text-align: center; margin: 10px 0; color: #666; }
        .status { display: inline-block; padding: 5px 10px; border-radius: 3px; font-size: 0.9em; }
        .online { background: #2ecc71; color: white; }
        .offline { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Монитор температуры</h1>
            <p>Устройство: {{ device_name }} | Место: {{ location }}</p>
            <p>Статус: <span class="status {{ status_class }}">{{ status_text }}</span></p>
        </div>
        
        <div class="sensors">
            <div class="sensor-card">
                <div class="sensor-label">Температура</div>
                <div class="sensor-value temp" id="temp">--.-</div>
                <div>°C</div>
            </div>
            
            <div class="sensor-card">
                <div class="sensor-label">Влажность</div>
                <div class="sensor-value humidity" id="humidity">--.-</div>
                <div>%</div>
            </div>
            
            <div class="sensor-card">
                <div class="sensor-label">Давление</div>
                <div class="sensor-value pressure" id="pressure">--.-</div>
                <div>гПа</div>
            </div>
            
            <div class="sensor-card">
                <div class="sensor-label">Точка россы</div>
                <div class="sensor-value temp" id="dewPoint">--.-</div>
                <div>°C</div>
            </div>
        </div>
        
        <div class="last-update">
            Последнее обновление: <span id="lastUpdate">--:--:--</span>
        </div>
        
        <div class="chart-container">
            <h3>Температура за последний час</h3>
            <canvas id="tempChart" width="400" height="200"></canvas>
        </div>
    </div>
    
    <script>
        // Обновление значений
        async function updateData() {
            try {
                const response = await fetch('/api/current');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('temp').textContent = data.temperature.toFixed(1);
                    document.getElementById('humidity').textContent = data.humidity.toFixed(1);
                    document.getElementById('pressure').textContent = data.pressure.toFixed(1);
                    document.getElementById('dewPoint').textContent = (data.temperature-0.36*(100.0-data.humidity)).toFixed(1);
                    document.getElementById('lastUpdate').textContent = 
                        new Date(data.timestamp).toLocaleTimeString();
                    
                    // Обновление статуса
                    const statusElem = document.querySelector('.status');
                    if (data.sensor_connected) {
                        statusElem.className = 'status online';
                        statusElem.textContent = 'Датчик подключен';
                    } else {
                        statusElem.className = 'status offline';
                        statusElem.textContent = 'Датчик отключен';
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }
        
        // Загрузка истории для графика
        async function loadChart() {
            try {
                const response = await fetch('/api/history?hours=1');
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    const ctx = document.getElementById('tempChart').getContext('2d');
                    
                    // Удаляем старый график если есть
                    if (window.tempChart) {
                        window.tempChart.destroy();
                    }
                    
                    const labels = data.data.map(d => 
                        new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    );
                    const temps = data.data.map(d => d.temperature);
                    
                    window.tempChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Температура °C',
                                data: temps,
                                borderColor: '#e74c3c',
                                backgroundColor: 'rgba(231, 76, 60, 0.1)',
                                borderWidth: 2,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: false
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Ошибка графика:', error);
            }
        }
        
        // Автообновление
        updateData();
        loadChart();
        setInterval(updateData, 10000); // Каждые 10 секунд
        setInterval(loadChart, 60000);  // Каждую минуту
        
        // Перезагрузка графика при изменении размера окна
        window.addEventListener('resize', loadChart);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
